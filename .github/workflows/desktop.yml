name: Desktop build

# Does the desktop app compile?
#
# Separate from release.yml on purpose. That one signs, bundles and publishes,
# and only runs on a tag — which makes a tag the first moment anyone finds out
# the Rust does not build. This answers the same question in five minutes, on
# every platform, without producing anything anyone could install by accident.
#
# It matters more than usual here because the shell was written before a Rust
# toolchain was available to check it, so the first green run of this workflow
# is the first evidence that desktop/ is real rather than plausible.

# Three runners per run, so it is deliberately hard to trigger by accident.
#
# `push` is limited to main. On a branch with an open pull request the two
# triggers both fire on every commit, which is two identical three-platform
# builds for one push — six runners to answer one question. The pull_request
# trigger covers branches; this one covers merges.
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Also bundle the installers and upload them (nothing is published)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "tools/build/build.mjs"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "tools/build/build.mjs"

# A second push supersedes the first: nobody needs the compile result for a
# commit that has already been replaced.
#
# The bundle runs get their own group. They take five times as long as a compile
# check and are dispatched deliberately to read the artifact names off a real
# build — having an unrelated push twenty minutes later cancel one is how you
# lose an afternoon to a workflow doing exactly what it was told.
concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.bundle && 'bundle' || 'compile' }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false          # one platform's failure must not hide the others
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-22.04
            # 22.04, not latest: the oldest runner carrying webkit2gtk 4.1, which
            # is the floor declared in Cargo.toml and on the download page.
            # Building on a newer image silently raises the glibc requirement and
            # the binary then refuses to start on the distributions we claim.
            label: Linux
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
                                  librsvg2-dev patchelf libssl-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # cargo build rather than a full `tauri build`: it exercises every line of
      # Rust and the link step, which is where the unknowns are, without paying
      # for bundling, code signing or a DMG. release.yml does the bundling once
      # this is known to be green.
      - name: Compile
        working-directory: desktop/src-tauri
        run: cargo build --locked --verbose

      # ── the dress rehearsal ──────────────────────────────────────────────
      # Everything downstream of a release — the URLs on /download/, the
      # Homebrew cask, the winget manifest — is a filename, and Tauri's naming
      # differs per target and has changed between versions. tools/release/
      # manifest.mjs says so itself: its asset table is "guesses until the
      # first real release, and the most likely thing here to be wrong".
      #
      # This turns the guess into a listing, on demand, without publishing
      # anything. Run it before a tag, not after: the alternative is that the
      # first tag is also the first time anyone sees a real filename.
      # tauri.conf.json's beforeBuildCommand runs tools/build/build.mjs, which
      # imports esbuild — so the frontend's devDependencies have to be here
      # before `tauri build` starts, or it fails inside the bundler with
      # "Cannot find package 'esbuild'".
      - name: Node, for the frontend build
        if: inputs.bundle
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Install frontend devDependencies
        if: inputs.bundle
        run: npm ci

      - name: Bundle the installers
        if: inputs.bundle
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload them
        if: inputs.bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7

      # Warnings are not failures here. The scaffold is new and a pedantic gate
      # on day one would mean fixing style before it has ever run.
      - name: Clippy (advisory)
        working-directory: desktop/src-tauri
        continue-on-error: true
        run: |
          rustup component add clippy
          cargo clippy -- -W clippy::all
