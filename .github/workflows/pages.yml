name: Deploy to GitHub Pages

# Publishes the static frontend when a version tag is pushed. Nothing else.
#
# This is the only workflow in the repository, and it deliberately runs no
# tests. The checks live in .husky/ and run on the machine the code is written
# on, before the commit exists — see docs/RELEASING.md. CI that runs after the
# push reports a mistake that is already in the history; a hook refuses to make
# it. The trade is that the gate is only as good as the developer's machine,
# which is accepted knowingly.
#
# Tags rather than pushes to main because "merged" and "released" are different
# decisions. Work can land on main and sit there; it goes to users when someone
# runs `npm run release`, which verifies, writes the changelog, and pushes the
# tag that triggers this.
#
# There IS a build step now, and only here. docs/ARCHITECTURE.md §1 chose native
# ES modules with no bundler and named the conditions to revisit — "past ~40
# modules" and "the @import chain becomes a visible load delay" — and both
# arrived together. The same paragraph prescribed the answer: a concatenation
# step at DEPLOY time, not a build step in development.
#
# So `src/` is still plain ES modules on disk. `npm run serve` needs no build,
# the .husky hooks check real modules, and the bundle exists only inside _site.
# tools/build.mjs owns it; tests/bundle.mjs boots what that script produces.
#
# `backend/` is excluded here — it is deployed separately by FastAPI Cloud,
# which watches the branch.

on:
  push:
    tags:
      - "v*"
  # Manual re-deploy of whatever tag you pick from the ref dropdown. Useful when
  # a deploy failed for an infrastructure reason and the code is fine.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy — let it finish, then queue the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The one dependency the deploy has. `src/` is still plain ES modules on
      # disk — this installs esbuild for tools/build.mjs and nothing else runs
      # against the source tree.
      - run: npm ci

      # Copying, bundling, and both service-worker stamps, in one place.
      #
      # This used to be three shell steps here. It moved into tools/build.mjs so
      # that "what ships" has ONE definition: tests/bundle.mjs runs the same
      # script and boots what it produces, which is the only way a check of the
      # deploy can be a check of the DEPLOY rather than of a second description
      # of it that drifted.
      #
      # VERSION is stamped from the TAG rather than the commit, so the string a
      # user's cache is keyed on is the same one the app shows in "What's new"
      # and the same one heading CHANGELOG.md — one identity for a release
      # instead of three. workflow_dispatch has no tag and falls back to the
      # short SHA, which still produces a unique cache name.
      - name: Build site
        run: npm run build -- _site

      - name: Sanity check
        run: |
          set -euo pipefail
          # src/ui/install.js is deliberately absent from this list now: the
          # deploy ships bundles, not the module tree. src/main.js and
          # src/landing/landing.js are the entry points the HTML names, and
          # tests/bundle.mjs is what proves the chunks behind them resolve.
          for f in index.html app.html manifest.webmanifest sw.js \
                   robots.txt sitemap.xml changelog.json CHANGELOG.md \
                   src/main.js src/styles/main.css \
                   src/landing/landing.js src/landing/landing.css \
                   icons/icon-192.png icons/icon-512.png \
                   icons/maskable-192.png icons/maskable-512.png \
                   social/og-card.png \
                   help/index.html blog/index.html \
                   help/clipboard-sync-not-working/index.html \
                   help/install/index.html \
                   download/index.html download/download.css \
                   src/landing/download.js; do
            test -f "_site/$f" || { echo "::error::missing $f"; exit 1; }
          done
          python3 -c "import xml.dom.minidom;xml.dom.minidom.parse('_site/sitemap.xml')"
          # Manifest: valid JSON, and no SVG in icons[].
          #
          # The SVG is not a harmless extra entry. An icon declaring sizes:"any"
          # satisfies Chrome's "at least one icon >= 144px" test on paper, so it
          # wins the selection — and then Chrome cannot rasterise it for an app
          # icon, reports `no-acceptable-icon`, and does NOT fall back to the
          # PNGs sitting right above it. One SVG line silently removed the
          # install button from the omnibox while every other criterion passed.
          # Verified with Page.getInstallabilityErrors: dropping it is the whole
          # fix. icon.svg is still the favicon in index.html — that is fine, a
          # <link rel="icon"> and manifest icons[] are unrelated code paths.
          python3 -c "import json,sys; icons=json.load(open('_site/manifest.webmanifest')).get('icons',[]); svg=[i['src'] for i in icons if i.get('type')=='image/svg+xml' or i['src'].endswith('.svg')]; png=any(i.get('sizes')=='512x512' and i.get('purpose')=='any' for i in icons); svg and print('::error::manifest icons[] contains SVG '+str(svg)+' - this breaks PWA installability in Chrome. Use PNG only.'); png or print('::error::manifest has no 512x512 purpose=any PNG icon'); sys.exit(1 if (svg or not png) else 0)"
          # The app must never be indexable. If this tag is ever dropped, every
          # rendered session — key, clipboard contents, history — becomes
          # crawlable. Fail the deploy rather than find out from a search result.
          grep -q 'name="robots" content="noindex' _site/app.html || {
            echo "::error::app.html is missing its noindex meta tag"; exit 1; }
          # Same reasoning, for the CSP. It is the second line of defence behind
          # ui/dom.js esc(), which is the only thing between peer-controlled clip
          # content and innerHTML. tests/static-check.mjs asserts this over the
          # SOURCE pages; this asserts it over what is actually about to ship.
          for f in _site/index.html _site/app.html $(find _site -name index.html); do
            grep -q 'http-equiv="Content-Security-Policy"' "$f" || {
              echo "::error::${f#_site/} is missing its Content-Security-Policy meta tag"; exit 1; }
          done
          echo "Files to publish: $(find _site -type f | wc -l)"

      # enablement:true turns Pages on via the API if it is not already.
      # Without it the very first run fails with "Get Pages site failed …
      # verify that the repository has Pages enabled", which is a chicken-and-egg
      # trap: the workflow that configures Pages needs Pages configured.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
