name: Deploy to GitHub Pages

# Publishes the static frontend on every push to main.
#
# There is no build step by design: the app is native ES modules, so the deploy
# is a straight file copy. That is also why `backend/` is excluded here — it is
# deployed separately by FastAPI Cloud, which watches this same branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy — let it finish, then queue the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/
          cp manifest.webmanifest sw.js _site/ 2>/dev/null || true
          cp -r icons _site/ 2>/dev/null || true
          # Docs are useful next to the app for a pre-alpha project.
          cp -r docs _site/
          cp README.md _site/
          # Pages runs Jekyll by default, which ignores files starting with _.
          touch _site/.nojekyll

      - name: Sanity check
        run: |
          test -f _site/index.html
          test -f _site/src/main.js
          test -f _site/src/styles/main.css
          echo "Files to publish: $(find _site -type f | wc -l)"

      # enablement:true turns Pages on via the API if it is not already.
      # Without it the very first run fails with "Get Pages site failed …
      # verify that the repository has Pages enabled", which is a chicken-and-egg
      # trap: the workflow that configures Pages needs Pages configured.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
