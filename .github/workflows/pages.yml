name: Deploy to GitHub Pages

# Publishes the static frontend when a version tag is pushed. Nothing else.
#
# This is the only workflow in the repository, and it deliberately runs no
# tests. The checks live in .husky/ and run on the machine the code is written
# on, before the commit exists — see docs/RELEASING.md. CI that runs after the
# push reports a mistake that is already in the history; a hook refuses to make
# it. The trade is that the gate is only as good as the developer's machine,
# which is accepted knowingly.
#
# Tags rather than pushes to main because "merged" and "released" are different
# decisions. Work can land on main and sit there; it goes to users when someone
# runs `npm run release`, which verifies, writes the changelog, and pushes the
# tag that triggers this.
#
# There is no build step by design: the app is native ES modules, so the deploy
# is a straight file copy. That is also why `backend/` is excluded here — it is
# deployed separately by FastAPI Cloud, which watches the branch.

on:
  push:
    tags:
      - "v*"
  # Manual re-deploy of whatever tag you pick from the ref dropdown. Useful when
  # a deploy failed for an infrastructure reason and the code is fine.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy — let it finish, then queue the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble site
        run: |
          set -euo pipefail          # no silent partial copies
          mkdir -p _site
          cp index.html app.html manifest.webmanifest sw.js robots.txt sitemap.xml README.md _site/
          # changelog.json is read at runtime by src/ui/whatsNew.js, and
          # CHANGELOG.md is what its "full history" link points at. Both are
          # generated by tools/changelog.mjs at release time and committed, so
          # there is nothing to build here — only to copy.
          cp changelog.json CHANGELOG.md _site/
          # social/ holds the Open Graph card. It lives outside icons/ on
          # purpose: icons/ is the PWA icon set and every file in it is
          # precached by the service worker, and a share card that only
          # crawlers ever fetch has no business in a user's offline cache.
          cp -r src icons docs social _site/
          # Content sections — help/ and blog/. Each is a directory holding an
          # index.html, and cp -r takes the articles nested inside it too, so a
          # new page needs no change here at all. Copied by glob rather than
          # named one by one because a forgotten per-page edit fails silently as
          # a 404 rather than as a broken build.
          for d in */ ; do
            if [ -f "${d}index.html" ] && [ "$d" != "_site/" ]; then
              cp -r "$d" _site/
              echo "content page: ${d}"
            fi
          done
          # Pages runs Jekyll by default, which ignores files starting with _.
          touch _site/.nojekyll

      # The service worker serves static assets cache-first, and a changed sw.js
      # is also what tells the browser an update exists at all. Bumping VERSION
      # by hand is a step someone will eventually forget, and forgetting it pins
      # every returning user to a stale shell. Stamp it instead, so it cannot be
      # got wrong.
      #
      # From the TAG, not the commit SHA, now that tags are what deploy. The
      # version a user's cache is keyed on is then the same string the app shows
      # in "What's new" and the same one heading CHANGELOG.md — one identity for
      # a release instead of three. workflow_dispatch has no tag, so it falls
      # back to the short SHA and still produces a unique cache name.
      - name: Stamp service worker version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            STAMP="${GITHUB_REF_NAME}"
          else
            STAMP="${GITHUB_SHA:0:12}"
          fi
          sed -i -E "s/^const VERSION = \".*\";/const VERSION = \"${STAMP}\";/" _site/sw.js
          grep -q "const VERSION = \"${STAMP}\";" _site/sw.js || {
            echo "::error::Could not stamp VERSION in sw.js — the declaration format changed."
            exit 1
          }
          echo "Service worker version: ${STAMP}"

      - name: Sanity check
        run: |
          set -euo pipefail
          for f in index.html app.html manifest.webmanifest sw.js \
                   robots.txt sitemap.xml changelog.json CHANGELOG.md \
                   src/main.js src/styles/main.css src/ui/install.js \
                   icons/icon-192.png icons/icon-512.png \
                   icons/maskable-192.png icons/maskable-512.png \
                   social/og-card.png \
                   help/index.html blog/index.html \
                   help/clipboard-sync-not-working/index.html; do
            test -f "_site/$f" || { echo "::error::missing $f"; exit 1; }
          done
          python3 -c "import xml.dom.minidom;xml.dom.minidom.parse('_site/sitemap.xml')"
          # Manifest: valid JSON, and no SVG in icons[].
          #
          # The SVG is not a harmless extra entry. An icon declaring sizes:"any"
          # satisfies Chrome's "at least one icon >= 144px" test on paper, so it
          # wins the selection — and then Chrome cannot rasterise it for an app
          # icon, reports `no-acceptable-icon`, and does NOT fall back to the
          # PNGs sitting right above it. One SVG line silently removed the
          # install button from the omnibox while every other criterion passed.
          # Verified with Page.getInstallabilityErrors: dropping it is the whole
          # fix. icon.svg is still the favicon in index.html — that is fine, a
          # <link rel="icon"> and manifest icons[] are unrelated code paths.
          python3 -c "import json,sys; icons=json.load(open('_site/manifest.webmanifest')).get('icons',[]); svg=[i['src'] for i in icons if i.get('type')=='image/svg+xml' or i['src'].endswith('.svg')]; png=any(i.get('sizes')=='512x512' and i.get('purpose')=='any' for i in icons); svg and print('::error::manifest icons[] contains SVG '+str(svg)+' - this breaks PWA installability in Chrome. Use PNG only.'); png or print('::error::manifest has no 512x512 purpose=any PNG icon'); sys.exit(1 if (svg or not png) else 0)"
          # The app must never be indexable. If this tag is ever dropped, every
          # rendered session — key, clipboard contents, history — becomes
          # crawlable. Fail the deploy rather than find out from a search result.
          grep -q 'name="robots" content="noindex' _site/app.html || {
            echo "::error::app.html is missing its noindex meta tag"; exit 1; }
          echo "Files to publish: $(find _site -type f | wc -l)"

      # enablement:true turns Pages on via the API if it is not already.
      # Without it the very first run fails with "Get Pages site failed …
      # verify that the repository has Pages enabled", which is a chicken-and-egg
      # trap: the workflow that configures Pages needs Pages configured.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
