name: Deploy to GitHub Pages

# Publishes the static frontend on every push to main.
#
# There is no build step by design: the app is native ES modules, so the deploy
# is a straight file copy. That is also why `backend/` is excluded here — it is
# deployed separately by FastAPI Cloud, which watches this same branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy — let it finish, then queue the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble site
        run: |
          set -euo pipefail          # no silent partial copies
          mkdir -p _site
          cp index.html app.html manifest.webmanifest sw.js robots.txt sitemap.xml README.md _site/
          # social/ holds the Open Graph card. It lives outside icons/ on
          # purpose: icons/ is the PWA icon set and every file in it is
          # precached by the service worker, and a share card that only
          # crawlers ever fetch has no business in a user's offline cache.
          cp -r src icons docs social _site/
          # Pages runs Jekyll by default, which ignores files starting with _.
          touch _site/.nojekyll

      # The service worker serves static assets cache-first, and a changed sw.js
      # is also what tells the browser an update exists at all. Bumping VERSION
      # by hand is a step someone will eventually forget, and forgetting it
      # pins every returning user to a stale shell. Stamp it from the commit
      # instead, so it is impossible to get wrong.
      - name: Stamp service worker version
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:12}"
          sed -i -E "s/^const VERSION = \".*\";/const VERSION = \"${SHA}\";/" _site/sw.js
          grep -q "const VERSION = \"${SHA}\";" _site/sw.js || {
            echo "::error::Could not stamp VERSION in sw.js — the declaration format changed."
            exit 1
          }
          echo "Service worker version: ${SHA}"

      - name: Sanity check
        run: |
          set -euo pipefail
          for f in index.html app.html manifest.webmanifest sw.js \
                   robots.txt sitemap.xml \
                   src/main.js src/styles/main.css src/ui/install.js \
                   icons/icon-192.png icons/icon-512.png \
                   icons/maskable-192.png icons/maskable-512.png \
                   social/og-card.png; do
            test -f "_site/$f" || { echo "::error::missing $f"; exit 1; }
          done
          python3 -c "import json;json.load(open('_site/manifest.webmanifest'))"
          python3 -c "import xml.dom.minidom;xml.dom.minidom.parse('_site/sitemap.xml')"
          # The app must never be indexable. If this tag is ever dropped, every
          # rendered session — key, clipboard contents, history — becomes
          # crawlable. Fail the deploy rather than find out from a search result.
          grep -q 'name="robots" content="noindex' _site/app.html || {
            echo "::error::app.html is missing its noindex meta tag"; exit 1; }
          echo "Files to publish: $(find _site -type f | wc -l)"

      # enablement:true turns Pages on via the API if it is not already.
      # Without it the very first run fails with "Get Pages site failed …
      # verify that the repository has Pages enabled", which is a chicken-and-egg
      # trap: the workflow that configures Pages needs Pages configured.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
