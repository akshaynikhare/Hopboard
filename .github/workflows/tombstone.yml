name: Tombstone the old GitHub Pages site

# Replaces the old origin with a redirect, and — the part that actually matters
# — with a service worker whose only job is to delete the previous one.
#
# This file is the replacement for pages.yml, which built and deployed the
# frontend until the site moved to Cloudflare Pages at realtimeclipboard.com.
# Deploys now happen in Cloudflare, from a build command, triggered by a push
# to main; see docs/RELEASING.md.
#
# ---------------------------------------------------------------------------
# Why a redirect alone would not have worked
# ---------------------------------------------------------------------------
#
# The old site is a PWA. Its service worker serves the app shell CACHE-FIRST, so
# a returning visitor's browser answers the navigation out of Cache Storage and
# may never make a request that a 301 could intercept. An installed PWA is worse
# still: it launches straight at the cached start_url. Those users would have
# gone on running a build from before the move, talking to the relay, seeing no
# updates, and reporting bugs against code that no longer exists — with no
# server-side lever available to reach them, because the whole point of the
# cache-first shell is that the server is not consulted.
#
# What IS still consulted is sw.js. A browser rechecks the worker script on
# navigation (and at most every 24 hours), byte-compares it, and installs a
# changed one. That is the single remaining channel to the old origin, and this
# workflow uses it to make the worker uninstall itself, drop every cache, and
# reload the page — which then hits the redirect below.
#
# ---------------------------------------------------------------------------
# When to run it
# ---------------------------------------------------------------------------
#
# Manually, once, AFTER realtimeclipboard.com is verified live — run it before
# the new site works and you have pointed everyone at a broken page. Re-runnable
# safely; it is idempotent.
#
# Do NOT turn Pages off afterwards. The old URLs are what years of links and
# search results point at, and an origin that 404s cannot serve the worker that
# cleans up the installs still out there.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEW_ORIGIN: https://realtimeclipboard.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the tombstone
        run: |
          set -euo pipefail
          mkdir -p _tomb
          touch _tomb/.nojekyll

          # The worker. Version string is bumped by the date so a re-run is
          # always byte-different from whatever is installed — including from a
          # previous run of this same workflow.
          cat > _tomb/sw.js <<SW
          /* RealtimeClipboard has moved to ${NEW_ORIGIN}
           *
           * This worker replaces the app's real service worker on the old
           * origin. It caches nothing, serves nothing, and exists only to undo
           * its predecessor. Cache Storage, service workers and localStorage
           * are all origin-scoped, so none of it followed the app to the new
           * domain — it is stranded here until something deletes it.
           */
          const STAMP = "tombstone-$(date -u +%Y%m%d%H%M%S)";

          // Do not wait for the old worker's clients to close. They are the
          // clients we are trying to rescue, and a user with the app pinned in
          // a tab could keep the old worker alive indefinitely.
          self.addEventListener("install", e => e.waitUntil(self.skipWaiting()));

          self.addEventListener("activate", e => e.waitUntil((async () => {
            for (const k of await caches.keys()) await caches.delete(k);
            await self.clients.claim();
            // Unregister BEFORE reloading. The reload navigates to the redirect
            // page on this origin, and a still-registered worker would be
            // rechecked and reinstalled on the way through.
            await self.registration.unregister();
            for (const c of await self.clients.matchAll({ type: "window" })) {
              c.navigate(c.url).catch(() => {});
            }
          })()));

          // No fetch handler at all: every request goes straight to the
          // network, which is where the redirect lives.
          SW

          # The redirect page, used for every path on the old origin.
          cat > _tomb/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>RealtimeClipboard has moved</title>
          <link rel="canonical" href="${NEW_ORIGIN}/">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=${NEW_ORIGIN}/">
          <style>
            body { font: 16px/1.6 system-ui, sans-serif; max-width: 34rem;
                   margin: 20vh auto; padding: 0 1.5rem; color: #222; }
            a { color: #007acc; }
            @media (prefers-color-scheme: dark) {
              body { background: #111; color: #eee; }
            }
          </style>
          <h1>RealtimeClipboard has moved</h1>
          <p>The app now lives at <a href="${NEW_ORIGIN}/">realtimeclipboard.com</a>.
             You should be redirected automatically.</p>
          <p>If you installed the old app, it is being cleaned up in the
             background — reopen it once and it will send you here.</p>
          <script>
            /* Belt and braces: if a stale worker is somehow still registered
               when this page renders, take it out from the page side too. */
            navigator.serviceWorker?.getRegistrations?.()
              .then(rs => Promise.all(rs.map(r => r.unregister())))
              .catch(() => {});
            caches?.keys?.().then(ks => Promise.all(ks.map(k => caches.delete(k))))
              .catch(() => {});
          </script>
          </html>
          HTML

          # Every entry point the old site had, so a bookmark or an installed
          # PWA's start_url lands on the redirect rather than on a 404. 404.html
          # covers the deep links — help/, blog/, download/ and the articles —
          # because GitHub Pages serves it for anything unmatched.
          for f in app.html 404.html; do cp _tomb/index.html "_tomb/$f"; done

          echo "Tombstone contents:"; ls -la _tomb

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _tomb

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
