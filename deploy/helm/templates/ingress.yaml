{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "realtimeclipboard-relay.fullname" . }}
  labels:
    {{- include "realtimeclipboard-relay.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /* Explicit paths, not "/": anything else reaching this hostname
                 is a mistake, and a 404 is a better answer than a proxied one. */}}
          {{- range $p := (list "/ws" "/sse" "/pub" "/health" "/stats") }}
          - path: {{ $p }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "realtimeclipboard-relay.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
{{- end }}
